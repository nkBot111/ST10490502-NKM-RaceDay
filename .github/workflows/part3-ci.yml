name: RaceDay Part 3 Build and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Raceday.API.sln
      - name: Build API, MVC website and tests
        run: dotnet build Raceday.API.sln -c Release --no-restore
      - name: Run xUnit tests
        run: dotnet test Raceday.API.sln -c Release --no-build --verbosity normal
