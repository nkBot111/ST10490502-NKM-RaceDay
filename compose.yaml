services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Run bash scripts/setup-codespaces.sh first}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - raceday_nkm_data:/var/opt/mssql
    restart: unless-stopped
volumes:
  raceday_nkm_data:
